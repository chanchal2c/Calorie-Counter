{% extends 'master/base.html' %}

{% block body %}

    <div class="w-75 mx-auto">
        <h1 class="py-3">Calorie List</h1>
        <a href="{% url "add_calorie" %}" class="btn btn-primary ">Add Calorie</a>

        <table class="table table-hover mt-3">
            <thead>
                <tr>
                    <th>SL</th>
                    <th>Item Name</th>
                    <th>Consumed Calorie</th>
                    <th>Added at</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>

                {% for i in data %}
                    <tr>
                        <td>{{forloop.counter}}</td>
                        <td>{{i.item_name}}</td>
                        <td>{{i.calorie}}</td>
                        <td>{{i.created_at}}</td>
                        <td>
                            <a href="{% url "edit_calorie" i.id %}" class="btn btn-primary">Edit</a>
                            <a href="{% url "delete_calorie" i.id %}" class="btn btn-danger">Delete</a>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    

{% endblock %}
